name: Publish to Instagram
on:
  push:
    paths: ['jobs/**']
  workflow_dispatch: {}
concurrency:
  group: ig-publish
  cancel-in-progress: false
permissions:
  contents: write
  pages: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Discover Pages URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | python3 -c "import sys,json;print(json.load(sys.stdin).get('html_url',''))" || true)
          if [ -z "$URL" ]; then
            OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
            REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
            URL="https://${OWNER}.github.io/${REPO}/"
          fi
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Pages base: $URL"
      - name: Publish pending jobs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}
        run: python3 automation/publish_to_instagram.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "ig-publisher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "IG publish results [skip ci]"
          git push
